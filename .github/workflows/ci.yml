name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Default packages include obsolete `tools`, which sdkmanager no longer serves.
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Unit tests and debug assemble
        run: ./gradlew test assembleDebug --no-daemon
